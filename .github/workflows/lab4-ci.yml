name: Lab 4 - CI and Docker Hub

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Tests, frontend build, Helm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "v4.3.1"

      - name: Lint Helm chart
        run: helm lint ./k8s/pc-components -f ./k8s/values.lab.yaml --strict

      - name: Package Helm chart
        run: |
          mkdir -p dist
          helm package ./k8s/pc-components --destination ./dist

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-components-helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  publish-images:
    name: Build and push ${{ matrix.image }}
    needs: verify-and-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pc-components-api
            context: .
            dockerfile: ./Dockerfile.api
          - image: pc-components-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: pc-components-migrator
            context: .
            dockerfile: ./Dockerfile.migration
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
