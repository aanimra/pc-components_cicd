apiVersion: v1
kind: Service
metadata:
  name: {{ include "pc-components.fullname" . }}-frontend
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
