apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "pc-components.scopedname" . }}-postgres-pv
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.db.storage.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ include "pc-components.scopedname" . }}-manual
  volumeMode: Filesystem
  hostPath:
    path: {{ printf "%s/%s" (trimSuffix "/" .Values.db.storage.hostPath) (include "pc-components.scopedname" .) | quote }}
    type: DirectoryOrCreate

