apiVersion: v1
kind: Service
metadata:
  name: {{ include "pc-components.fullname" . }}-postgres
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.db.port }}
      targetPort: postgres
