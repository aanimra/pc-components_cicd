apiVersion: v1
kind: Service
metadata:
  name: {{ include "pc-components.fullname" . }}-api
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
