{{- $secretName := printf "%s-db-auth" (include "pc-components.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
type: Opaque
{{- if and $existing (hasKey $existing.data "password") }}
# On upgrade preserve the credential used to initialize the existing PostgreSQL volume.
data:
  password: {{ index $existing.data "password" | quote }}
{{- else }}
# Only used for the first installation of this release in this namespace.
stringData:
  password: {{ required "db.auth.password must be set" .Values.db.auth.password | quote }}
{{- end }}
